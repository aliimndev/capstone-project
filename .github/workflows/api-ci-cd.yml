name: API CI/CD - Build & Deploy

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci-cd.yml'
      - 'Dockerfile'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Lint API
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest black flake8
      
      - name: Lint with flake8
        run: |
          flake8 apps/api/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apps/api/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Format check with black
        run: black --check apps/api/app || true
      
      - name: Run tests (if any)
        run: |
          pytest apps/api/tests --verbose || echo "No tests found"

  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Note: Secrets are accessed via ${{ secrets.SECRET_NAME }} which requires them
    # to be defined in GitHub Settings → Secrets → Actions
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Deploy to Cloudflare Workers
        run: |
          set -euo pipefail

          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-201fe0617db9cf5383f0008862507bf5}"
          WORKER_NAME="tmdb-api-prod-v2"

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          echo "Verifying Cloudflare API token..."
          token_status="$(curl -sS -o /tmp/cloudflare-token.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")"

          if [ "$token_status" != "200" ]; then
            echo "CLOUDFLARE_API_TOKEN is invalid or expired."
            cat /tmp/cloudflare-token.json
            exit 1
          fi

          echo "Checking access to Worker ${WORKER_NAME}..."
          worker_status="$(curl -sS -o /tmp/cloudflare-worker.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/services/${WORKER_NAME}")"

          if [ "$worker_status" != "200" ]; then
            echo "Token is valid, but cannot access Worker ${WORKER_NAME} in account ${ACCOUNT_ID}."
            echo "Create a token with Account > Account Settings > Read and Account > Workers Scripts > Edit for this account."
            cat /tmp/cloudflare-worker.json
            exit 1
          fi

          # Ensure TMDB API key is stored securely in Cloudflare
          echo "${{ secrets.TMDB_API_KEY }}" | npx wrangler secret put TMDB_API_KEY --env production

          # Deploy the Worker
          npx wrangler deploy apps/api/worker.ts --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Notification - Success
        if: success()
        run: echo "✅ API deployed successfully to Cloudflare Workers"
      
      - name: Notification - Failure
        if: failure()
        run: echo "❌ Deployment failed. Check logs above."
